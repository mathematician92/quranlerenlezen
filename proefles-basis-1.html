:root{--paper:#E7E9E3;--card:#FCFCFA;--ink:#17190F;--ink-2:#4A4F42;--line:#D3D7CC;--rubric:#8C2F39;
--carry:#2C5F6B;--groen:#3E7D3B;--moei:#B3261E;--nieuw:#3B5BDB;--merk:#C08A1E;--merk-vlak:#F6E7B8;
--zon:#C4541A;--zon-v:#FBE6D6;--maan:#3B5BDB;--maan-v:#E1E7FB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column}
.ar{font-family:'Al Mohanad',serif;direction:rtl;unicode-bidi:isolate}
button{font:inherit;color:inherit}

/* bovenbalk */
.balk{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px 0}
.balk .r1{display:flex;align-items:center;gap:10px}
.balk b{color:var(--rubric);font-size:15px}
.balk .nr{margin-left:auto;font-size:12px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer}

 display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(23,25,15,.06)}
.flip .a{transform:rotateY(180deg)}

 box-shadow:0 8px 24px rgba(23,25,15,.08);animation:kaartin .4s cubic-bezier(.2,.8,.2,1)}

 display:flex;align-items:center;gap:10px;transition:.15s}

@keyframes schud{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{max-width:520px;margin:12px auto 0;border-radius:14px;padding:12px 14px;display:none;animation:kaartin .3s}

.eind{max-width:520px;margin:20px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;animation:kaartin .4s}

/* gedeeld door de lessen */
.e{color:#B0336E}
.vr{color:#B0336E}
.stap3{display:flex;flex-direction:column;gap:8px;width:100%}

.uitkomst{text-align:center;min-height:118px;background:#F1F3EE;border-radius:12px;padding:6px 8px;width:100%}
.uitkomst .ar{font-size:42px;line-height:1.6}
.uitkomst .nl{color:var(--ink-2)}
.flip .a.e-v{background:#F7E1EC;border-color:#E3A9C6}

.lijn{display:flex;justify-content:space-between;align-items:center;width:100%;margin:6px 0 2px;position:relative}
/* menu */

.menu.op{display:block}

.balk .hamb{cursor:pointer;font-size:20px;background:none;border:0;padding:0}

 <div class="r1"><button class="hamb" id="hamb" aria-label="menu">☰</button><b id="ltitel"></b><span class="nr" id="lsub"></span></div>
 <div class="tabs">
  <button data-s="uitleg" class="op">Uitleg<span class="v">✓</span></button>

 </div>

<main>
<section class="scherm op" id="uitleg">
 <div class="stapel" id="stapel"></div>

  <button class="rond" id="terug" disabled>←</button>

 </div>

<div class="menu" id="menu"><div class="paneel"><h3>Basis grammatica</h3><div id="menulijst"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const LESSEN=[];
function LES(o){LESSEN.push(o);}
/* ---- hulpjes voor de lessen ---- */
function flits(...els){els.forEach(x=>{x.classList.remove('flits');void x.offsetWidth;x.classList.add('flits')});}
function wissel(knop,w,u,b,zonder,met,t0,t1){let aan=false;
 knop.onclick=()=>{aan=!aan;w.innerHTML=aan?met.ar:zonder.ar;u.innerHTML=aan?met.u:zonder.u;b.innerHTML=aan?met.b:zonder.b;flits(u,b);knop.textContent=aan?t1:t0;};}
const VR=(stam,eind)=>`${stam}<span class="vr ins">${eind}</span>`;
/* een rij keuzeknopjes; eerste staat aan */
function rij(plek,lijst,tekst,kies,ar){lijst.forEach((w,i)=>{const b=document.createElement('button');if(ar)b.className='ar';b.innerHTML=tekst(w);
 b.onclick=()=>{[...plek.children].forEach((x,j)=>x.classList.toggle('op',j===i));kies(i);};
 if(i===0)b.classList.add('op');plek.appendChild(b);});}
/* al- inkleuren: maanletter blauw al-, zonneletter grijze al + oranje letter */
function kleur(ar,zon){const m=ar.match(/^اَلْ?(.[ً-ْ]*)(.*)$/);
 return zon?`<span class="uit">اَل</span><span class="zon">${m[1]}</span>${m[2]}`:`<span class="al">اَلْ</span>${m[1]}${m[2]}`;}
const arIn=t=>t.replace(/([؀-ۿ][؀-ۿ\s؟،…]*[؀-ۿ؟])/g,'<span class="ar" style="font-size:1.35em">$1</span>');

/* losse Arabische stukjes in Nederlandse tekst apart zetten, zodat de volgorde klopt */
function isoleer(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),lijst=[];let n;
 while(n=w.nextNode()){if(/[\u0600-\u06FF]/.test(n.nodeValue)&&!n.parentElement.closest('.ar,h2'))lijst.push(n);}
 lijst.forEach(t=>{const sp=document.createElement('span');
  sp.innerHTML=t.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/([\u0600-\u06FF][\u0600-\u06FF\s،]*[\u0600-\u06FF]|[\u0600-\u06FF])/g,'<span class="ar">$1</span>');
  t.replaceWith(...sp.childNodes);});}
/* ---- voortgang ---- */
let KLAAR={};try{KLAAR=JSON.parse(localStorage.getItem('basis.klaar')||'{}')}catch(e){}
function bewaar(){try{localStorage.setItem('basis.klaar',JSON.stringify(KLAAR))}catch(e){}}

/* ---- tabs en menu ---- */
function toon(id){document.querySelectorAll('.scherm').forEach(s=>s.classList.toggle('op',s.id===id));
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('op',b.dataset.s===id));
 document.querySelector('.scherm.op').scrollTop=0;}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>toon(b.dataset.s));
const vink=id=>document.querySelector(`.tabs [data-s=${id}]`).classList.add('klaar');
function menuVullen(){$('#menulijst').innerHTML=LESSEN.map((l,i)=>`<a href="#" data-i="${i}" class="${i===LI?'nu':''} ${KLAAR[l.nr]?'klaar':''}">
 <span class="n">${KLAAR[l.nr]?'✓':l.nr}</span><span>${l.titel}<small>${l.kort}</small></span></a>`).join('');
 $('#menulijst').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();$('#menu').classList.remove('op');open(+a.dataset.i);});}
$('#hamb').onclick=()=>{menuVullen();$('#menu').classList.add('op');};
$('#menu').onclick=e=>{if(e.target.id==='menu')$('#menu').classList.remove('op');};

/* ---- een les openen ---- */
let LI=0,L,kaarten,ki=0;
function open(i){LI=i;L=LESSEN[i];try{localStorage.setItem('basis.les',L.nr)}catch(e){}
 $('#ltitel').textContent=`Basis grammatica · Les ${L.nr}`;$('#lsub').textContent=L.kort;
 document.title=`Basis ${L.nr} — ${L.kort}`;
 $('#lescss').textContent=L.css||'';
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('klaar'));
 /* uitleg */
 $('#stapel').innerHTML=L.kaarten.map(k=>`<div class="kaart">${k}</div>`).join('');
 kaarten=[...document.querySelectorAll('.kaart')];ki=0;
 document.querySelectorAll('.kaart').forEach(isoleer);
 document.querySelectorAll('.kaart h2').forEach(h=>{if(!h.querySelector('span'))h.innerHTML=arIn(h.innerHTML).replace(/font-size:1.35em/g,'font-size:1.15em');});
 $('#stip').innerHTML=kaarten.map(()=>'<i></i>').join('');
 zetKaart(0,1);
 /* voorbeelden */
 $('#vbintro').innerHTML=L.vbIntro||'Tik op een kaartje om te zien wat het betekent en hoe je het uitspreekt.';
 const om=new Set();$('#flips').innerHTML='';$('#fteller').textContent=`0 van ${L.vb.length} omgedraaid`;
 L.vb.forEach((v,i)=>{const f=document.createElement('div');f.className='flip';
  f.innerHTML=`<div class="in"><div class="v">${v.f}<small>${v.fs||'wat betekent het?'}</small><span class="hint">tik ↻</span></div>
   <div class="a ${v.cls||'e-v'}">${v.b||''}<b>${v.bb}</b><small>${v.bs||''}</small></div></div>`;
  f.onclick=()=>{f.classList.toggle('om');om.add(i);$('#fteller').textContent=`${om.size} van ${L.vb.length} omgedraaid`;if(om.size===L.vb.length)vink('vb');};
  $('#flips').appendChild(f);});
 /* oefenen */
 vi=0;goed=0;vraag();
 toon('uitleg');
 if(L.init)L.init();}
function zetKaart(n,r){kaarten[ki].classList.remove('op','terug');ki=n;const k=kaarten[ki];k.classList.add('op');if(r<0)k.classList.add('terug');
 [...$('#stip').children].forEach((d,i)=>d.classList.toggle('op',i===ki));
 $('#terug').disabled=ki===0;$('#verder').textContent=ki===kaarten.length-1?'Naar voorbeelden →':'Verder →';}
$('#verder').onclick=()=>{if(ki<kaarten.length-1)zetKaart(ki+1,1);else{vink('uitleg');toon('vb');}};
$('#terug').onclick=()=>ki>0&&zetKaart(ki-1,-1);
let sx=null;$('#uitleg').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#uitleg').addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;
 if(Math.abs(d)>50&&!e.target.closest('button,.rooster,.kies'))d<0?(ki<kaarten.length-1&&zetKaart(ki+1,1)):(ki>0&&zetKaart(ki-1,-1));sx=null;});
$('#naarOef').onclick=()=>{vink('vb');toon('oef');};

/* ---- oefenen ---- */
let vi=0,goed=0;
function vraag(){const V=L.vragen;$('#bk').style.width=(vi/V.length*100)+'%';if(vi===V.length)return eind();const v=V[vi];
 /* keuzes husselen, het goede antwoord onthouden */
 const vol=v.k.map((t,j)=>({t,g:j===v.g}));for(let i=vol.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vol[i],vol[j]]=[vol[j],vol[i]];}
 $('#oefplek').innerHTML=`<div class="vraag"><div class="n">Vraag ${vi+1} van ${V.length}</div><div class="q">${arIn(v.q)}</div>
  ${v.w?`<div class="w ar">${v.w}</div>`:''}<div class="opties"></div></div><div class="fb" id="fb"></div>`;

LES({nr:3,titel:'“Het … van …”',kort:'“het … van …”',kaarten:["<span class=\"lbl\">1 · twee woorden achter elkaar</span>\n   <h2>“Het boek van de jongen”</h2>\n   <p>Zet je twee woorden <b>direct achter elkaar</b>, dan betekent het <b>“het … van …”</b>. Er komt geen apart woord voor “van”.</p>\n   <div class=\"podium\">\n    <div class=\"groot ar\" id=\"k1w\" style=\"font-size:48px\">كِتَابٌ <span style=\"color:var(--ink-2);font-size:28px\">+</span> اَلْوَلَدُ</div>\n    <div class=\"uitspr\" id=\"k1u\">kitaabun + al-waladu</div>\n    <div class=\"betek\" id=\"k1b\">een boek + de jongen</div>\n   </div>\n   <div style=\"text-align:center\"><button class=\"actie\" id=\"k1k\" style=\"border-color:#B0336E;background:#F7E1EC;color:#B0336E\">⇄ zet ze aan elkaar</button></div>", "<span class=\"lbl\">2 · het eerste woord</span>\n   <h2>Het eerste woord: geen al-, geen -un</h2>\n   <p>Het eerste woord betekent al “het boek”, door het woord erna. Daarom krijgt het <b>geen al-</b> en <b>geen -un</b>, alleen <b class=\"e\">-u</b>.</p>\n   <div class=\"podium\">\n    <div class=\"stap3\">\n     <div class=\"nee\"><span class=\"x\">✗</span><span class=\"ar\">اَلْكِتَابُ الْوَلَدِ</span><small>niet met al-</small></div>\n     <div class=\"nee\"><span class=\"x\">✗</span><span class=\"ar\">كِتَابٌ الْوَلَدِ</span><small>niet met -un</small></div>\n     <div class=\"ok\"><span class=\"x\">✓</span><span class=\"ar\">كِتَابُ الْوَلَدِ</span><small><b>kitaabu l-waladi</b></small></div>\n    </div>\n   </div>", "<span class=\"lbl\">3 · het tweede woord</span>\n   <h2>Het tweede woord krijgt -i</h2>\n   <p>Het tweede woord eindigt op <b class=\"e\">-i</b> (kasra <span class=\"ar\" style=\"font-size:22px\">ـِ</span>). Zonder al- wordt het <b class=\"e\">-in</b>, en dan betekent het “van <b>een</b> …”.</p>\n   <div class=\"podium\">\n    <div class=\"duo\">\n     <div class=\"m\"><div class=\"ar\">كِتَابُ الْوَلَد<span class=\"e\">ِ</span></div><b>kitaabu l-walad<span class=\"e\">i</span></b><small>het boek van <b>de</b> jongen</small></div>\n     <div class=\"z\"><div class=\"ar\">كِتَابُ وَلَد<span class=\"e\">ٍ</span></div><b>kitaabu walad<span class=\"e\">in</span></b><small>het boek van <b>een</b> jongen</small></div>\n    </div>\n   </div>\n   <div class=\"tip\">💡 Hoor je bij het tweede woord <b>-i</b>, dan weet je: hier staat “van”.</div>", "<span class=\"lbl\">4 · uitspraak</span>\n   <h2>De a- van al- valt weg, en ة klinkt als t</h2>\n   <p>Na het eerste woord zeg je de a- van al- niet: <b>kitaabu <span class=\"e\">l-</span>waladi</b>. Bij een zonneletter smelt de l samen, net als in les 1.</p>\n   <div class=\"podium\">\n    <div class=\"stap3\">\n     <div><span class=\"ar\">بَابُ الْبَيْتِ</span><small><b>baabu l-baiti</b> · de deur van het huis</small></div>\n     <div><span class=\"ar\">بَيْتُ الرَّجُلِ</span><small><b>baitu r-radjoeli</b> · het huis van de man</small></div>\n     <div><span class=\"ar\">مَدْرَسَةُ الْوَلَدِ</span><small><b>madrasa<span class=\"e\">tu</span> l-waladi</b> · de school van de jongen</small></div>\n    </div>\n   </div>\n   <div class=\"tip\">💡 Uit les 2: ة klinkt als <b>t</b> als je doorleest. In “het … van …” lees je altijd door, dus <b>madrasatu</b>.</div>", "<span class=\"lbl\">5 · probeer het zelf</span>\n   <h2>Kies twee woorden en maak een paar</h2>\n   <div class=\"podium\" style=\"justify-content:flex-start;gap:4px\">\n    <div class=\"kies\">\n     <div class=\"lb\">1 · wat?</div><div class=\"rij a\" id=\"ra\"></div>\n     <div class=\"lb\">2 · van wie?</div><div class=\"rij b\" id=\"rb\"></div>\n    </div>\n    <div class=\"uitkomst\" id=\"uk\" style=\"width:100%\"></div>\n   </div>\n   <details><summary>Meer weten</summary>\n    <p>Dit heet een <b>iḍaafa</b>. Het tweede woord staat in de <b>genitief</b> (majroer), daarom de -i.</p>\n    <p>Heel vaak in de Koran en de hadith: <span class=\"ar\" style=\"font-size:20px\">كِتَابُ اللّٰهِ</span> (het boek van Allah), <span class=\"ar\" style=\"font-size:20px\">رَسُولُ اللّٰهِ</span> (de boodschapper van Allah), <span class=\"ar\" style=\"font-size:20px\">بَيْتُ اللّٰهِ</span> (het huis van Allah).</p>\n    <p>Ook veel namen werken zo: <span class=\"ar\" style=\"font-size:20px\">عَبْدُ اللّٰهِ</span> ʿAbdullaah = “dienaar van Allah”.</p>\n   </details>"],css:"\n.e{color:#B0336E}                 /* de uitgangen -u en -i */\n.w1{border-bottom:3px solid #2C5F6B;padding-bottom:2px}\n.w2{border-bottom:3px solid #C08A1E;padding-bottom:2px}\n.duo .m,.duo .z{background:#F1F3EE}\n.duo .ar{font-size:30px!important;white-space:nowrap}\n.stap3 .ar{white-space:nowrap;font-size:26px!important}\n.stap3{display:flex;flex-direction:column;gap:8px;width:100%}\n.stap3 div{display:flex;align-items:center;gap:10px;background:#F1F3EE;border-radius:10px;padding:6px 12px}\n.stap3 .ar{font-size:30px;line-height:1.5}\n.stap3 .x{font-size:20px;width:24px;text-align:center}\n.stap3 small{color:var(--ink-2);font-size:13px;margin-right:auto}\n.stap3 .ok{background:#E2F0E0} .stap3 .nee{background:#F8E1DF}\n.kies{width:100%}\n.kies .rij{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center;margin:4px 0 10px}\n.kies .rij button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;font-family:'Al Mohanad',serif;font-size:24px;line-height:1.7;cursor:pointer;transition:.2s}\n.kies .rij.a button.op{background:#DDEBEE;border-color:#2C5F6B;color:#2C5F6B}\n.kies .rij.b button.op{background:#F6E7B8;border-color:#C08A1E;color:#8A5F10}\n.kies .lb{font-size:12px;color:var(--ink-2);text-align:center;letter-spacing:.06em;text-transform:uppercase}\n.uitkomst{text-align:center;min-height:120px;background:#F1F3EE;border-radius:12px;padding:6px}\n.uitkomst .ar{font-size:42px;line-height:1.6}\n.flip .a.e-v{background:#F7E1EC;border-color:#E3A9C6}\n.flip .v .ar{font-size:30px}\n",

LES({nr:4,titel:'wa-, fa-, bi-, li-, ka-',kort:'wa- fa- bi- li- ka-',kaarten:["<span class=\"lbl\">1 · vijf kleine woordjes</span>\n   <h2>Ze plakken vast aan het volgende woord</h2>\n   <p>Deze vijf woordjes bestaan uit <b>één letter</b>. Ze staan nooit los, maar plakken <b>vóór</b> het woord erna. Tik erop:</p>\n   <div class=\"podium\" style=\"gap:12px\">\n    <div class=\"vijf\" id=\"vijf\"></div>\n    <div class=\"groot ar\" id=\"k1w\" style=\"font-size:56px\">بَيْتٌ</div>\n    <div class=\"uitspr\" id=\"k1u\">baitun</div>\n    <div class=\"betek\" id=\"k1b\">een huis</div>\n   </div>", "<span class=\"lbl\">2 · wa- en fa-</span>\n   <h2>“en” en “en toen”</h2>\n   <p><b class=\"e\">wa-</b> <span class=\"ar e\">وَ</span> is gewoon <b>“en”</b>. <b class=\"e\">fa-</b> <span class=\"ar e\">فَ</span> is <b>“en toen”</b> of <b>“dus”</b>: wat erna komt, gebeurt meteen daarna of volgt eruit.</p>\n   <div class=\"podium\">\n    <div class=\"duo\">\n     <div class=\"m\"><div class=\"ar\"><span class=\"e\">وَ</span>قَالَ</div><b><span class=\"e\">wa-</span>qaala</b><small>en hij zei</small></div>\n     <div class=\"z\"><div class=\"ar\"><span class=\"e\">فَ</span>قَالَ</div><b><span class=\"e\">fa-</span>qaala</b><small>en toen zei hij</small></div>\n    </div>\n   </div>\n   <div class=\"tip\">💡 In verhalen begint bijna elke zin met wa- of fa-. In het Nederlands laat je “en” dan vaak weg.</div>", "<span class=\"lbl\">3 · bi-, li- en ka-</span>\n   <h2>Na bi-, li- en ka- krijgt het woord -i</h2>\n   <p><b class=\"e\">bi-</b> <span class=\"ar e\">بِ</span> = met, door<br><b class=\"e\">li-</b> <span class=\"ar e\">لِ</span> = voor, van<br><b class=\"e\">ka-</b> <span class=\"ar e\">كَ</span> = zoals<br>Net als het tweede woord in les 3 eindigt het woord erna op <b class=\"e\">-i</b>.</p>\n   <div class=\"podium\">\n    <div class=\"stap3\">\n     <div><span class=\"ar\"><span class=\"e\">بِ</span>قَلَمٍ</span><small><b>bi-qalamin</b> · met een pen</small></div>\n     <div><span class=\"ar\"><span class=\"e\">لِ</span>وَلَدٍ</span><small><b>li-waladin</b> · voor een jongen</small></div>\n     <div><span class=\"ar\"><span class=\"e\">كَ</span>قَمَرٍ</span><small><b>ka-qamarin</b> · zoals een maan</small></div>\n    </div>\n   </div>", "<span class=\"lbl\">4 · samen met al-</span>\n   <h2>Met al- erachter valt de a- weg</h2>\n   <p>Komt er al- na het woordje, dan zeg je de a- van al- niet. En <b>li- + al-</b> schrijf je met één alif minder: <b class=\"e\">لِلْ</b>.</p>\n   <div class=\"podium\">\n    <div class=\"stap3\">\n     <div><span class=\"ar\"><span class=\"e\">وَ</span>الْكِتَابُ</span><small><b>wal-kitaabu</b> · en het boek</small></div>\n     <div><span class=\"ar\"><span class=\"e\">بِ</span>الْقَلَمِ</span><small><b>bil-qalami</b> · met de pen</small></div>\n     <div><span class=\"ar\"><span class=\"e\">وَ</span>الشَّمْسُ</span><small><b>wasj-sjamsu</b> · en de zon (zonneletter)</small></div>\n     <div><span class=\"ar\"><span class=\"e\">لِلْ</span>وَلَدِ</span><small><b>lil-waladi</b> · voor de jongen, niet <span class=\"ar\" style=\"font-size:18px\">لِالْوَلَدِ</span></small></div>\n    </div>\n   </div>", "<span class=\"lbl\">5 · probeer het zelf</span>\n   <h2>Kies een woordje en een woord</h2>\n   <div class=\"podium\" style=\"justify-content:flex-start;gap:4px\">\n    <div class=\"kies\">\n     <div class=\"lb\">1 · woordje</div><div class=\"rij a\" id=\"ra\"></div>\n     <div class=\"lb\">2 · woord</div><div class=\"rij b\" id=\"rb\"></div>\n    </div>\n    <div class=\"uitkomst\" id=\"uk\"></div>\n   </div>\n   <details><summary>Meer weten</summary>\n    <p>bi-, li- en ka- zijn <b>voorzetsels</b>. Na een voorzetsel staat een woord in de <b>genitief</b>, daarom de -i. wa- en fa- veranderen het woord erna niet.</p>\n    <p>Er kunnen er twee vóór een woord staan: <span class=\"ar\" style=\"font-size:20px\">وَلِلْوَلَدِ</span> = <b>wa-lil-waladi</b>, en voor de jongen.</p>\n    <p>Je kent er al één heel goed: <span class=\"ar\" style=\"font-size:20px\">بِسْمِ اللَّهِ</span> = <b>bi-smi llaahi</b>, in (met) de naam van Allah.</p>\n   </details>"],css:"\n.e{color:#B0336E}\n.duo .m,.duo .z{background:#F1F3EE}\n.duo .ar{font-size:34px!important;white-space:nowrap}\n.stap3{display:flex;flex-direction:column;gap:8px;width:100%}\n.stap3 div{display:flex;align-items:center;gap:10px;background:#F1F3EE;border-radius:10px;padding:6px 12px}\n.stap3 .ar{font-size:28px;line-height:1.5;white-space:nowrap;min-width:92px;text-align:center}\n.stap3 small{color:var(--ink-2);font-size:13px}\n.stap3 small b{color:var(--ink)}\n.vijf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;direction:rtl}\n.vijf button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px 2px 6px;cursor:pointer;transition:.2s}\n.vijf button .ar{font-size:34px;line-height:1.4;display:block}\n.vijf button small{font-size:12px;color:var(--ink-2);direction:ltr;display:block}\n.vijf button.op{background:#F7E1EC;border-color:#B0336E}\n.kies{width:100%}\n.kies .rij{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center;margin:4px 0 10px}\n.kies .rij button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;font-family:'Al Mohanad',serif;font-size:24px;line-height:1.7;cursor:pointer;transition:.2s}\n.kies .rij button.op{background:#F7E1EC;border-color:#B0336E;color:#B0336E}\n.kies .rij.b button.op{background:#F6E7B8;border-color:#C08A1E;color:#8A5F10}\n.kies .lb{font-size:12px;color:var(--ink-2);text-align:center;letter-spacing:.06em;text-transform:uppercase}\n.uitkomst{text-align:center;min-height:120px;background:#F1F3EE;border-radius:12px;padding:6px;width:100%}\n.uitkomst .ar{font-size:44px;line-height:1.6}\n.flip .a.e-v{background:#F7E1EC;border-color:#E3A9C6}\n.flip .v .ar{font-size:32px}\n",

`<span class="lbl">1 · zin zonder werkwoord</span>
 <h2>“Is” zeg je niet</h2>
 <p>In het Arabisch zeg je niet “het huis <b>is</b> groot”, maar gewoon <b>“het huis groot”</b>. Het woordje “is” denk je erbij.</p>
 <div class="podium"><div class="stap3">

 </div></div>`,
`<span class="lbl">2 · let goed op al-</span>

 <p>Heeft het beschrijvende woord <b>ook al-</b>, dan is het geen zin maar één geheel: <b>“het grote huis”</b>. Zonder al- (met -un) is het een zin.</p>
 <div class="podium">
  <div class="groot ar" id="k2w" style="font-size:46px">اَلْبَيْتُ كَبِيرٌ</div>

`<span class="lbl">3 · zin met werkwoord</span>
 <h2>Het werkwoord staat meestal vooraan</h2>
 <p>In verhalen begint de zin bijna altijd met het <b>werkwoord</b>. Letterlijk staat er “ging de jongen”. In het Nederlands zeg je “de jongen ging”.</p>
 <div class="podium"><div class="stap3">
  <div><span class="ar">ذَهَبَ الْوَلَدُ</span><small><b>dhahaba l-waladu</b> · de jongen ging</small></div>
  <div><span class="ar">قَالَ إِبْرَاهِيمُ</span><small><b>qaala ibraahiemu</b> · Ibraahiem zei</small></div>
  <div><span class="ar">جَلَسَتِ الْبِنْتُ</span><small><b>djalasati l-bintu</b> · het meisje ging zitten</small></div>
 </div></div>
 <div class="tip">💡 Een woord dat op <b>-a</b> eindigt en vooraan staat (ذَهَبَ, قَالَ), is vaak een werkwoord.</div>`,
`<span class="lbl">4 · wie doet het?</span>
 <h2>Wie het doet: -u · wat het ondergaat: -a</h2>
 <p>Wie iets <b>doet</b>, eindigt op <b class="e">-u</b>. Het ding of de persoon waaraan iets <b>gedaan wordt</b>, eindigt op <b class="e">-a</b>.</p>

`<span class="lbl">5 · probeer het zelf</span>
 <h2>Tik op elk woord</h2>
 <p>Tik op de woorden om te zien wat ze betekenen. Dan zie je de hele zin.</p>
 <div class="podium" style="justify-content:flex-start;gap:12px">
  <div class="zin6" id="zin6"></div>

  <button class="actie" id="z6vlg">volgende zin →</button>
 </div>
 <details><summary>Meer weten</summary>
  <p>Een zin zonder werkwoord heet <b>jumla ismiyya</b> (naamwoordzin), een zin met werkwoord vooraan <b>jumla fi'liyya</b> (werkwoordzin).</p>
  <p>Wie het doet heet de <b>faa'il</b> (-u), wat het ondergaat de <b>maf'oel bihi</b> (-a).</p>
  <p>Na een woord als فِي (in) of عَلَى (op) eindigt het woord op -i, net als na bi- en li- in les 4.</p>
 </details>`],

const WW=[['كَتَب','katab','schreef','schreven','schrijven'],['ذَهَب','dhahab','ging','gingen','gaan'],
 ['جَلَس','djalas','ging zitten','gingen zitten','zitten'],['فَتَح','fatah','opende','openden','openen']];
const PV=[['hij','َ','a','hij',0],['zij','َتْ','at','zij',0],['ik','ْتُ','tu','ik',0],['jij (m)','ْتَ','ta','jij (jongen)',0],
 ['jij (v)','ْتِ','ti','jij (meisje)',0],['wij','ْنَا','naa','wij',1],['jullie','ْتُمْ','tum','jullie',1],['zij (mv)','ُوا','oe','zij (meer mensen)',1]];
function verl(w,p){return `${w[0]}<span class="e">${p[1]}</span>`;}
function verlNl(w,p){const v=p[4]?w[3]:w[2];return `${p[3]} ${v}`;}
function verlKiezer(personen){let ka=0,kb=0;
 const t=()=>{const w=WW[ka],p=personen[kb];
  $('#uk').innerHTML=`<div class="ar ins">${verl(w,p)}</div><div><b>${w[1]}<span class="e">${p[2]}</span></b></div><div class="nl">${verlNl(w,p)}</div>`;};
 rij($('#ra'),WW,w=>w[0]+'َ',i=>{ka=i;t();},1);rij($('#rb'),personen,p=>p[0],i=>{kb=i;t();});t();}
const CSS7=`.duo .m,.duo .z{background:#F1F3EE}.duo .ar{font-size:34px!important;white-space:nowrap}
.acht{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.acht button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 2px;font-size:13px;cursor:pointer;line-height:1.2}
.acht button.op{background:#F7E1EC;border-color:#B0336E;color:#B0336E;font-weight:600}`;
function personenKnoppen(personen,w,woordNl){const acht=$('#acht');
 personen.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p[0];
  b.onclick=()=>{acht.querySelectorAll('button').forEach(x=>x.classList.remove('op'));b.classList.add('op');
   $('#k1w').innerHTML=`${w[0]}<span class="e ins">${p[1]}</span>`;
   $('#k1u').innerHTML=`${w[1]}<b class="e">${p[2]}</b>`;$('#k1b').textContent=verlNl(w,p);flits($('#k1u'),$('#k1b'));};
  acht.appendChild(b);if(i===0)b.classList.add('op');});}
