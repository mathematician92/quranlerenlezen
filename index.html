<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabisch Letterbord</title>
<script>/* Laadt surahs.js als die naast deze pagina staat (GitHub- en offline-versie). */
if (!/claude|anthropic/.test(location.hostname)) document.write('<script src="firebase-config.js?v=' + Date.now() + '"><\/script><script src="surahs.js?v=' + Date.now() + '"><\/script>');</script>
<style>
@font-face{font-family:"KFGQPC Hafs";src:url("fonts/kfgqpc-hafs.otf") format("opentype");font-display:swap}
@font-face{font-family:"Baloo 2";font-weight:500;src:url("fonts/baloo-2-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:600;src:url("fonts/baloo-2-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:700;src:url("fonts/baloo-2-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;src:url("fonts/baloo-2-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Pixelify Sans";font-weight:500;src:url("fonts/pixelify-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Pixelify Sans";font-weight:700;src:url("fonts/pixelify-sans-latin-700-normal.woff2") format("woff2")}
/* Layout: één scherm. Bovenaan de opdracht, in het midden het woord dat het kind bouwt, onderaan het letterbord. */
:root{
  --paper:#EEF3EF;
  --card:#FFFFFF;
  --ink:#1B2A27;
  --muted:#5B6B66;
  --accent:#0E7A63;
  --accent-soft:#D6EEE6;
  --sun:#F2B01E;
  --sun-soft:#FFF1CC;
  --good:#2A9147;
  --good-soft:#DDF3E3;
  --bad:#CF3F55;
  --bad-soft:#FBE1E5;
  --line:#D3DDD8;
  --key-shadow:#BCCAC3;
  --f-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-ar:"KFGQPC Hafs","Amiri Quran","Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic",serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:18px;line-height:1.35;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ar{font-family:var(--f-ar);font-feature-settings:"kern"}
[hidden]{display:none!important}

#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--card);border-bottom:2px solid var(--line)}
.brand{font-weight:800;font-size:22px;color:var(--accent);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .ar{font-size:26px}
.hmid{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;min-width:0;overflow:hidden}
.dot{font-size:24px;line-height:1;color:var(--line)}
.dot.now{color:var(--accent)}
.dot.gold{color:var(--sun)}
.dot.silver{color:#9AA8A3}
.hbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;font-weight:700;font-size:16px;white-space:nowrap}
.fsi{font-size:18px;line-height:1}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0;background:var(--accent-soft);transform-origin:left;transform:scaleX(0)}
.hold span{position:relative}
.hold.holding .fill{transition:transform 1.6s linear;transform:scaleX(1)}
.holdtip{font-size:13px;color:var(--muted);white-space:nowrap}

main{min-height:0;overflow:auto}
.view{height:100%}

/* ---------- start ---------- */
.start{max-width:980px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:22px}
.start h1{margin:0;font-size:40px;line-height:1.1;text-wrap:balance}
.start h2{margin:0 0 8px;font-size:22px;color:var(--muted);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mode{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--key-shadow)}
.mode b{font-size:24px}
.mode small{font-size:17px;color:var(--muted)}
.mode .ex{font-size:40px;text-align:center;padding:6px 0;color:var(--accent);min-height:64px}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.go{align-self:flex-start;background:var(--accent);color:#fff;border:0;border-radius:18px;padding:14px 40px;font-size:28px;font-weight:800;box-shadow:0 5px 0 #075443}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #075443}
.note{color:var(--muted);font-size:16px}
.warn{background:var(--sun-soft);border-radius:12px;padding:10px 14px}

/* ---------- wie ---------- */
.who{max-width:1100px;margin:0 auto;padding:40px 20px;display:flex;flex-direction:column;gap:26px;align-items:center}
.who h1{font-size:44px;margin:0;text-align:center}
.whos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;width:100%}
.whob{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 6px 0 var(--key-shadow);text-align:center}
.whob:active{transform:translateY(4px);box-shadow:0 2px 0 var(--key-shadow)}
.whob b{font-size:30px;line-height:1.15}
.whob small{color:var(--muted);font-size:16px}
.whoicon{width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.whoicon .ar{font-size:46px;color:var(--accent)}
.onemode{display:flex;align-items:center;gap:18px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 20px;max-width:640px}
.onemode b{font-size:26px}
.profrow{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.gamechecks{display:flex;flex-wrap:wrap;gap:8px 18px;padding-top:24px}
.gamechecks .toggle{font-weight:600;font-size:16px}
/* ---------- play ---------- */
.play{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px 20px 14px;max-width:1280px;margin:0 auto}
.prompt{background:var(--card);border-radius:var(--r);border:2px solid var(--line);padding:8px 18px;display:flex;align-items:center;gap:18px;min-height:clamp(84px,14vh,130px)}
.prompt .lbl{font-weight:700;color:var(--muted);font-size:18px;white-space:nowrap}
.prompt .target{flex:1;text-align:center;font-size:clamp(40px,8vh,76px);line-height:1.9;direction:rtl}
.prompt .nl{flex:1;text-align:center;font-size:clamp(36px,7vh,60px);font-weight:800;color:var(--accent)}
.prompt .q{flex:1;text-align:center;font-size:24px;color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;width:160px}
.bar i{display:block;height:100%;background:var(--sun);transform-origin:left}
.small{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:700;font-size:16px}

.mid{min-height:0;overflow:auto}
.hoofdtxt{text-align:center;padding:0 8px}
.hoofdtxt .wbad{color:var(--bad);background:var(--bad-soft);border-radius:8px}
.hoofdtxt .wgood{color:var(--good)}
.prompt.slim{min-height:0;padding:6px 18px}
.built.long{font-size:clamp(32px,6vh,56px);white-space:normal;line-height:2.1;max-width:100%}
.tile.sp{background:transparent;border-style:dashed;min-width:40px}
.build{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:stretch}
.slate{background:var(--card);border-radius:var(--r);border:2px solid var(--line);padding:6px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.built{font-size:clamp(46px,10vh,90px);line-height:1.9;direction:rtl;min-height:1.9em;text-align:center;white-space:nowrap}
.built.ok{color:var(--good)}
.placeholder{font-family:var(--f-ui);font-size:22px;color:var(--muted);line-height:clamp(75px,16vh,145px)}
.tiles{display:flex;flex-direction:row;gap:8px;direction:rtl;flex-wrap:wrap;justify-content:center;min-height:62px}
.tile{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:0 10px 2px;min-width:58px;display:flex;flex-direction:column;align-items:center;line-height:1}
.tile .g{font-size:32px;line-height:1.9}
.tile .f{font-family:var(--f-ui);font-size:12px;color:var(--muted);direction:ltr}
.tile.sel{border-color:var(--sun);background:var(--sun-soft);box-shadow:0 0 0 3px var(--sun)}
.tile.good{border-color:var(--good);background:var(--good-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
.tile.ghost{opacity:.85;cursor:default}
.side{display:flex;flex-direction:column;gap:8px;width:190px}
.btn{border:0;border-radius:16px;padding:10px 14px;font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--key-shadow);background:var(--card);border:2px solid var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--key-shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 0 #075443;font-size:26px;flex:1}
.btn.next{background:var(--sun);border-color:var(--sun);color:var(--ink);box-shadow:0 4px 0 #B5800C;font-size:24px;flex:1}
.feedback{min-height:30px;text-align:center;font-weight:700;font-size:19px}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.hints{margin:2px 0 0;padding:0;list-style:none;font-size:17px;font-weight:600;color:var(--ink);text-align:center}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:800;text-decoration:underline;padding:0 6px;font-size:17px}
.answer{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;font-weight:700;color:var(--muted)}

.board{display:flex;flex-direction:column;gap:8px;min-height:0;justify-content:flex-end}
.board.locked{opacity:.35;pointer-events:none}
.letters{display:grid;grid-template-columns:repeat(14,1fr);gap:7px;direction:rtl}
.row2{display:grid;grid-template-columns:9fr 13fr;gap:18px;direction:rtl}
.extras{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;direction:rtl}
.harakat{display:grid;grid-template-columns:repeat(13,1fr);gap:7px;direction:rtl}
.key{height:clamp(46px,7.6vh,72px);border:2px solid var(--line);background:var(--card);border-radius:12px;box-shadow:0 4px 0 var(--key-shadow);font-family:var(--f-ar);font-size:clamp(26px,4.6vh,40px);line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--key-shadow)}
.key.ex{background:#F7FAF8}
.key.mk{flex-direction:column;gap:0;background:var(--accent-soft);border-color:#B5DCCF}
.key.mk .m{font-size:clamp(26px,4.4vh,38px);line-height:1.2}
.key.mk .n{font-family:var(--f-ui);font-size:10px;white-space:nowrap;color:var(--muted);line-height:1}
.key.on{background:var(--sun-soft);border-color:var(--sun)}

.overlay{position:fixed;inset:0;background:rgba(27,42,39,.35);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12vh;z-index:10}
.pop{background:var(--card);border-radius:24px;padding:18px 22px 22px;box-shadow:0 14px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;align-items:center}
.pop p{margin:0;font-weight:700;color:var(--muted)}
.forms{display:flex;gap:14px;direction:rtl}
.formbtn{width:132px;height:150px;border:3px solid var(--line);background:var(--paper);border-radius:18px;box-shadow:0 5px 0 var(--key-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.formbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--key-shadow)}
.formbtn .g{font-family:var(--f-ar);font-size:58px;line-height:1.9}
.formbtn .f{font-weight:800;font-size:20px}

/* ---------- round end ---------- */
.done{max-width:760px;margin:0 auto;padding:60px 20px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.done h1{font-size:46px;margin:0}
.bigstars{font-size:48px;letter-spacing:4px;line-height:1.2}
.bigstars .gold{color:var(--sun)} .bigstars .silver{color:#9AA8A3} .bigstars .none{color:var(--line)}

/* ---------- parent ---------- */
.parent{max-width:1080px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:18px}
.parent h1{margin:0;font-size:32px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 18px;font-weight:700}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:22px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:16px}
.field input,.field select{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.field input.arin{font-family:var(--f-ar);font-size:30px;direction:rtl;padding:2px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.minikb{display:grid;grid-template-columns:repeat(23,1fr);gap:5px;direction:rtl}
.minikb button{height:44px;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--f-ar);font-size:24px;padding:0}
.minikb button.mk{background:var(--accent-soft)}
.minikb button.bs{font-family:var(--f-ui);font-size:18px;grid-column:span 2}
.preview{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn2{border:2px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:8px 18px;font-weight:800}
.btn2.ghost{background:#fff;color:var(--accent)}
.btn2.danger{background:var(--bad);border-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
td.arw{font-family:var(--f-ar);font-size:28px;direction:rtl;text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
.grp{font-weight:800;color:var(--accent);padding-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--paper);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:15px;font-weight:600}
.hardl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hl{background:var(--paper);border-radius:14px;padding:8px 12px;display:flex;gap:12px;align-items:center}
.hl .ar{font-size:38px;line-height:1.9;min-width:36px;text-align:center}
.hl small{font-size:14px;color:var(--muted);line-height:1.3}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:14px;font-weight:700}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--sun-soft);color:#8A5D00}
.pill.low{background:var(--bad-soft);color:var(--bad)}
.pill.new{background:var(--paper);color:var(--muted)}
.save{font-size:14px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700}
.toggle input{width:22px;height:22px}

/* ---------- mijnrace ---------- */
.race{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:12px 20px 16px;max-width:1280px;margin:0 auto}
.px{font-family:"Pixelify Sans",var(--f-ui)}
.mine{position:relative;height:clamp(180px,31vh,270px);border:4px solid #3B2A1E;border-radius:6px;overflow:hidden;
  background:linear-gradient(#86CDF3 0 22%, #62B23F 22% 28%, #8B5A2B 28% 34%, transparent 34%),
  repeating-conic-gradient(#7B7B7B 0 25%, #6C6C6C 0 50%) 0 0/28px 28px}
.lane{position:absolute;left:14px;right:34px;height:33%}
.lane.top{top:35%}
.lane.bot{bottom:2%}
.rail{position:absolute;left:0;right:0;bottom:2px;height:8px;background:repeating-linear-gradient(90deg,#5B3B1F 0 6px,#A7A7A7 6px 26px);border-top:2px solid #C9C9C9}
.cart{position:absolute;bottom:8px;width:clamp(58px,10vh,84px);aspect-ratio:1;transition:left .55s cubic-bezier(.2,.8,.3,1.2)}
.cart.rv{transition:none}
.cart svg,.gem svg,.ex svg,.bigsvg svg{width:100%;height:100%;display:block}
.ctag{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-family:"Pixelify Sans",var(--f-ui);font-weight:700;font-size:15px;line-height:1;color:#fff;padding:3px 7px;border-radius:4px;white-space:nowrap}
.ctag.robo{background:#7B4FD1}
.ctag.me{background:#E0861A}
.tag{display:none;position:absolute;right:4px;top:-2px;font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:0 8px;border-radius:4px}
.gem{position:absolute;bottom:22px;width:18px;height:18px;transform:translateX(-50%);animation:bob 1.6s ease-in-out infinite}
.gem.got{opacity:0;transform:translate(-50%,-30px) scale(1.4);transition:all .5s}
.finish{position:absolute;right:6px;top:34%;bottom:0;width:18px;background:repeating-conic-gradient(#fff 0 25%, #222 0 50%) 0 0/18px 18px;border-left:2px solid #222}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;color:#fff;text-shadow:4px 4px 0 #3B2A1E;font-weight:700}
.quest{background:#fff;border:4px solid #3B2A1E;border-radius:6px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 16px;min-height:0}
.quest .ask{margin:0;font-size:24px;font-weight:700;text-align:center}
.quest .ask .ar{font-size:40px;color:var(--accent);vertical-align:middle}
.gapword{display:inline-flex;align-items:center;direction:rtl;font-size:clamp(52px,10vh,96px);line-height:1.9}
.gapword.ok{color:var(--good)}
.gap{display:inline-flex;align-items:center;justify-content:center;width:.85em;height:1em;border:4px dashed var(--sun);background:var(--sun-soft);border-radius:6px;margin:0 .06em;font-family:"Pixelify Sans",var(--f-ui);font-size:.7em;color:#B5800C;animation:pulse 1.2s ease-in-out infinite}
.opts{display:flex;gap:16px;direction:rtl;flex-wrap:wrap;justify-content:center}
.opt{width:clamp(110px,15vh,150px);height:clamp(118px,17vh,160px);background:#C9CED6;border:4px solid #3A3F47;border-radius:4px;box-shadow:inset 5px 5px 0 #E7EBF0,inset -5px -5px 0 #8C939C;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.opt:active{transform:translateY(3px)}
.opt .g{font-family:var(--f-ar);font-size:clamp(44px,7vh,64px);line-height:1.8}
.opt .f{font-family:"Pixelify Sans",var(--f-ui);font-size:20px;font-weight:700}
.opt.wrong{background:#F2B8BF;opacity:.55;box-shadow:none}
.opt.right{background:#9BE07F;box-shadow:inset 5px 5px 0 #CFF5BF,inset -5px -5px 0 #5FAE44}
.bigletter{font-family:var(--f-ar);font-size:clamp(90px,17vh,160px);line-height:1.5;color:var(--ink)}
.bigletter.ok{color:var(--good)}
.spark{position:fixed;width:10px;height:10px;pointer-events:none;z-index:20;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 30px)) scale(.6);opacity:0}}
.opt.big1{width:clamp(120px,18vh,170px);height:clamp(120px,18vh,170px)}
.opt.big1 .g{font-size:clamp(60px,10vh,90px)}
.model{display:flex;align-items:center;gap:16px}
.model .lbl{font-weight:700;color:var(--muted);font-size:18px}
.target2{font-size:clamp(38px,7vh,64px);line-height:1.8;direction:rtl}
.pieces{gap:10px;max-width:1000px}
.piece{width:clamp(84px,11vh,112px);height:clamp(96px,13vh,124px)}
.piece .g{font-size:clamp(36px,5.6vh,52px)}
.piece .f{font-size:15px}

<script>
"use strict";
/* ================= Arabische letters ================= */
const ZWJ = "‍", ZWNJ = "‌", TAT = "ـ", SHADDA = "ّ";
const LETTERS = "ابتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");
const EXTRA = ["ء","أ","إ","آ","ٱ","ؤ","ئ","ة","ى"];
const DAGGER = "ٰ", MADDAH = "ٓ";
const SUKUN = "ْ", SUKUN_SHOW = "ۡ";  /* mushaf-sukun (kopje) */
const RZ = "۟", RZ_SHOW = "ْ";        /* ronde nul boven een stille alif */
const SWAW = "ۥ", SYA = "ۦ";
const FLAGS = {[SHADDA]:"sh", [DAGGER]:"da", [MADDAH]:"md", [RZ]:"rz", [SWAW]:"sw", [SYA]:"sy"};
const FLAG_KEYS = ["sh","da","md","rz","sw","sy"];
const show_ = m => m === SUKUN ? SUKUN_SHOW : m === RZ ? RZ_SHOW : m;
const ALL = new Set([...LETTERS, ...EXTRA]);
const RIGHT_ONLY = new Set(["ا","د","ذ","ر","ز","و","أ","إ","آ","ٱ","ؤ","ة","ى"]); // verbinden niet naar links
const NO_JOIN = new Set(["ء"," "]);
const VOWELS = ["َ","ِ","ُ","ْ","ً","ٍ","ٌ"];
const HARAKAT = [
  {m:"َ", n:"fatha"}, {m:"ِ", n:"kasra"}, {m:"ُ", n:"damma"}, {m:"ْ", n:"sukun"},
  {m:SHADDA, n:"shadda"}, {m:"ً", n:"fathatan"}, {m:"ٍ", n:"kasratan"}, {m:"ٌ", n:"dammatan"}, {m:DAGGER, n:"kleine alif"}, {m:MADDAH, n:"maddah"}, {m:RZ, n:"ronde nul"}, {m:SWAW, n:"kleine waw"}, {m:SYA, n:"kleine ya"}
];
/* Het mushaf-lettertype schrijft een losse ي zonder puntjes. Op de toets tonen we hem met puntjes, zodat hij niet lijkt op ى. */
const DOTTED_YA = 'font-family:"Amiri Quran","Noto Naskh Arabic",serif';
const FORM_LBL = {begin:"begin", midden:"midden", eind:"eind", los:"los"};
const FORM_FULL = {begin:"beginvorm", midden:"middenvorm", eind:"eindvorm", los:"losse vorm"};
const MAP_IN = {"ی":"ي","ک":"ك","ىٔ":"ئ"};

const dual = c => !RIGHT_ONLY.has(c) && !NO_JOIN.has(c);
function formsFor(c){
  if (NO_JOIN.has(c)) return ["los"];
  if (RIGHT_ONLY.has(c)) return ["eind","los"];
  return ["begin","midden","eind","los"];
}
function expectedForm(us, i){
  const c = us[i].l;
  const jp = i > 0 && dual(us[i-1].l) && !NO_JOIN.has(c);
  const jn = dual(c) && i < us.length-1 && !NO_JOIN.has(us[i+1].l);
  return jp && jn ? "midden" : jp ? "eind" : jn ? "begin" : "los";
}
function parseWord(str){
  let s = (str || "").normalize("NFKC").replace(/[ـ‌‍]/g, "").replace(/\s+/g, " ").trim();
  for (const [a,b] of Object.entries(MAP_IN)) s = s.split(a).join(b);
  s = s.replace(/ۡ/g, SUKUN).replace(/۠/g, RZ).replace(/[ۖ-۞ۣۢۧ-ۭ]/g, "");
  s = s.replace(/\u08F0/g, "\u064B").replace(/\u08F1/g, "\u064C").replace(/\u08F2/g, "\u064D").replace(/\u06E4/g, MADDAH).replace(/[\u0660-\u0669\u06F0-\u06F90-9\u06DD\u06DE\uFD3E\uFD3F()\[\].,:;\u060C\u061B\u061F]/g, " ").replace(/\s+/g, " ").trim();
  const units = [], bad = [];
  for (const ch of s){
    if (ch === " ") { if (units.length && !units[units.length-1].sp) units.push({l:" ", sp:true, sh:false, v:""}); }
    else if (ALL.has(ch)) units.push({l:ch, sh:false, v:""});
    else if (FLAGS[ch]){ if (units.length && !units[units.length-1].sp) units[units.length-1][FLAGS[ch]] = true; }
    else if (VOWELS.includes(ch)){ if (units.length) units[units.length-1].v = ch; }
    else bad.push(ch);
  }
  units.forEach(canon);
  units.forEach((u,i) => u.f = expectedForm(units, i));
  return {units, bad, hasHarakat: units.some(u => u.v || FLAG_KEYS.some(k => u[k]))};
}
const marks = u => u.sp ? "" : (u.sh ? SHADDA : "") + show_(u.v || "") + (u.da ? DAGGER : "") + (u.md ? MADDAH : "") + (u.rz ? RZ_SHOW : "") + (u.sw ? SWAW : "") + (u.sy ? SYA : "");
/* In de mushaf zien ي en ى er aan het eind van een woord hetzelfde uit; daarom tellen ze als dezelfde letter. */
const sameLetter = (a, b) => a === b || ((a === "ي" || a === "ى") && (b === "ي" || b === "ى"));
/* آ wordt opgeslagen als ا met maddah, zodat beide manieren van tikken goed tellen. */
function canon(u){ if (u.l === "آ") { u.l = "ا"; u.md = true; } return u; }
const back = f => f === "midden" || f === "eind";
const fwd = f => f === "begin" || f === "midden";
/* Bouwt de tekst zó dat elke letter precies in de gekozen vorm verschijnt, ook als die vorm fout is. */
function renderWord(us){
  let s = "";
  us.forEach((u,i) => {
    const p = us[i-1], n = us[i+1];
    if (u.sp) { s += " "; return; }
    const joinedPrev = p && fwd(p.f) && back(u.f);
    if (i > 0 && !joinedPrev && !p.sp) s += ZWNJ;
    if (back(u.f) && !joinedPrev) s += ZWJ;
    s += u.l + marks(u);
    const joinedNext = n && fwd(u.f) && back(n.f);
    if (fwd(u.f) && !joinedNext) s += ZWJ;
  });
  return s;
}
function tileText(u, f){
  if (u.sp) return "␣";
  f = f || u.f; const m = u.l + marks(u);
  return f === "begin" ? m + TAT : f === "midden" ? TAT + m + TAT : f === "eind" ? TAT + m : m;
}

/* ================= Gegevens ================= */

const DEFAULT_SETTINGS = {name:"", hideSec:5, perRound:10, sound:true, checkHarakat:true, lastMode:"overschrijven", lastGroup:"*", lastLes:"Sukūn – blad 1", raceTempo:150, raceKind:"letters"};
const clone = o => JSON.parse(JSON.stringify(o));
/* Kinderen en hun spellen. games: overschrijven, onthouden, zelf, hoofd, race:een, race:letters, race:bouw */
const DEFAULT_PROFILES = [
  {id:"mehr",  name:"Mehr Sultan",  tag:"MEHR",  icon:"book",  games:["hoofd"]},
  {id:"ameer", name:"Ameer Hussain", tag:"AMEER", icon:"miner", games:["race:letters"]},
  {id:"klein", name:"Amin Shah & Mohiyuddin", tag:"JIJ", icon:"gem", games:["race:een"]}
];
const GAME_LBL = {"overschrijven":"Overschrijven", "onthouden":"Onthouden", "zelf":"Zelf schrijven", "hoofd":"Uit het hoofd (hifz)",
  "race:een":"Mijnrace: Eén letter", "race:letters":"Mijnrace: Letters zoeken", "race:bouw":"Mijnrace: Woord bouwen"};
const PROF_KEYS = ["lastMode","lastGroup","raceKind","raceTempo","pos","letterSet"];
const EMPTY_PROGRESS = () => ({words:{}, letters:{}, days:{}});
let active = null;
const profiles = () => state.settings.profiles || DEFAULT_PROFILES;
const prof = () => profiles().find(x => x.id === active);
function loadProgress(p){
  if (!p) return;
  if (p.profiles) state.allProgress = p.profiles;
  else if (p.words) state.allProgress = {ameer: Object.assign(EMPTY_PROGRESS(), p)}; /* oude voortgang hoort bij Ameer */
  if (active) state.progress = state.allProgress[active] = state.allProgress[active] || EMPTY_PROGRESS();
}
const state = {
  allProgress: {},
  words: [],
  progress: {words:{}, letters:{}, days:{}},
  settings: clone(DEFAULT_SETTINGS)
};

/* Woorden uit het lesboek (les 1: Sukūn), overgenomen van de foto's. */
const BOOK = [
  ["Sukūn – blad 1", "أَنتَ|ٱِهْدِ|بَعْدُ|بَطْشَ|سَعَى|كُنتُ|لَسْتَ|قُرْءَانٌ|بَرْدًا|مِرْيَةٍ|ٱِرْجِعْ|إِرْبَةِ|مِصْرَ|قِطْرٍ|قِرْطَاسٍ|مِرْصَادِ|فِرْقَةٍ|مَنِ ٱرْتَضَى|ٱِرْحَمْ|ٱِرْتَبْتُمْ|أَنذِرْ|خَيْرٌ|فَٱصْبِرْ|صَبْرًا|يَسِيرٌ|غُلْبًا|فَصْلٌ|قَدْحًا|قَضْبًا|كَأْسًا"],
  ["Sukūn – blad 2", "كَدْحًا|لَغْوًا|مِسْكٌ|نَخْلًا|نَشْطًا|نَّفْسٍ|نَقْعًا|يُسْرًا|أَبْقَىٰ|عَدْنٍ|عَشْرٍ|تَخْشَىٰ|يَسْعَىٰ|يَتْلُوا۟|يَدْعُوا۟|تَجْرِى|يَهْدِى|يُغْنِى|أَلْقَتْ|أَمْهِلْ|ٱِقْرَأْ|فَٱرْغَبْ|فَٱنصَبْ|وَٱنْحَرْ|مِنْ هَادٍ|مِنْ عَلَقٍ|أَنْعَمْتَ|مَنْ ءَامَنَ|مِنْ|خِلَافٍ|أَلْهَمَ|أَنشَرَ|أَنقَضَ|دَمْدَمَ|عَسْعَسَ|أَعْبُدُ|نَعْبُدُ|تَخْرُجُ|تَحْسَبُ|يَشْرَبُ|يَشْهَدُ|تَرْهَقُ|تَعْرِفُ|أُقْسِمُ|يُبْدِئُ|دُنْيَا|قِنْوَانٌ|صِنْوَانٌ|بُنْيَانٌ"],
  ["Sukūn – blad 3", "حُشِرَتْ|سُطِحَتْ|كُشِطَتْ|نُشِرَتْ|بَلْ رَانَ|أَثَرْنَ|وَسَطْنَ|فَرَغْتَ|تَأْتُونَ|يُسْقَوْنَ|يَفْعَلُونَ|يَعْمَلُونَ|يَعْلَمُونَ|يَضْحَكُونَ|يَكْسِبُونَ|يَدْخُلُونَ|يَنظُرُونَ|رَأَى|مَنْ رَاقٍ|أَنذَرْنَا|أَنزَلْنَا|خَلَقْنَا|رَفَعْنَا|وَضَعْنَا|نُطْفَةٍ|عِبْرَةً|زَجْرَةٌ|تَذْكِرَةٌ|مُسْفِرَةٌ|مُؤْصَدَةٌ|مَا يَشَآءُ|ٱِسْتَطَعْتُ|شَهْرٍ|فَجْرٍ|قَدْرٍ|زَكَوٰةً"],
  ["Sukūn – blad 4", "صَلَوٰةً|بَٰلِغِهِۦ|مَمْنُونٍ|مَحْفُوظٍ|نِسَآءً|طُوًى|مَسْرُورًا|مَآءً|أَبْوَٰبًا|أَزْوَٰجًا|أَشْتَاتًا|إِطْعَٰمٌ|أَعْنَٰبًا|أَفْوَاجًا|أَلْفَافًا|قُرْءَٰنًا|ٱلْحَمْدُ|ٱِهْدِنَا|وَٱلْفَتْحُ|وَٱلْعَصْرِ|مِنَ ٱلْمُعْصِرَٰتِ|مَعَ ٱلْعُسْرِ|مَا ٱلْقَارِعَةُ|وَإِذَا ٱلْمَوْءُۥدَةُ|يَنظُرُ ٱلْمَرْءُ|كَٱلْفَرَاشِ ٱلْمَبْثُوثِ"],
  ["Sukūn – zinnen", "كَٱلْعِهْنِ ٱلْمَنفُوشِ|لَيْلَةُ ٱلْقَدْرِ|أَخْرَجَتِ ٱلْأَرْضُ|مِنْ أَهْلِ ٱلْكِتَٰبِ|عِندَ ذِى ٱلْعَرْشِ|يَمْنَعُونَ ٱلْمَاعُونَ|وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ|ذُو ٱلْعَرْشِ ٱلْمَجِيدُ|لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍ|أَعْطَيْنَٰكَ ٱلْكَوْثَرَ"]
].flatMap(([les, list], gi) => list.split("|").map((ar, i) => ({id:`b${gi+1}-${i+1}`, ar, nl:"", les})));
/* Voegt boekwoorden toe die nog niet in de lijst staan (en niet bewust verwijderd zijn). */
function mergeBook(){
  state.words = state.words.filter(w => !/^s\d+$/.test(w.id));  /* oude voorbeeldwoorden weg */
  const have = new Set(state.words.map(w => w.id)), gone = new Set(state.settings.removed || []);
  const add = BOOK.filter(w => !have.has(w.id) && !gone.has(w.id));
  if (add.length) state.words = state.words.concat(add);
  return add.length;
}
function readLocal(){
  try {
    const w = JSON.parse(localStorage.getItem("atb:woorden") || "null");
    const p = JSON.parse(localStorage.getItem("atb:voortgang") || "null");
    const s = JSON.parse(localStorage.getItem("atb:instellingen") || "null");
    if (w && Array.isArray(w.list)) state.words = w.list;
    loadProgress(p);
    if (s) state.settings = Object.assign(clone(DEFAULT_SETTINGS), s);
  } catch(e) {}
}
function migrate(){
  const s = state.settings;
  if (!s.migr1) { s.migr1 = true; (s.profiles || []).forEach(pf => { if (pf.id === "ameer") pf.games = pf.games.filter(g => g !== "race:bouw"); if (!pf.games.length) pf.games = ["race:letters"]; }); }
}
function splitAyat(txt){
  return String(txt || "").split(/[\n\u06DD]+|[\u0660-\u0669\u06F0-\u06F9]+|\(\s*\d+\s*\)|\d+/).map(x => x.trim()).filter(x => parseWord(x).units.length);
}
/* Surahs uit het bestand surahs.js (handig op GitHub: overal te bewerken). */
function mergeFileSurahs(){
  const list = Array.isArray(window.SURAHS) ? window.SURAHS : null;
  if (!list) return false;
  const fresh = [];
  list.forEach((sr, si) => {
    const naam = String(sr.naam || ("Surah " + (si + 1))).trim();
    splitAyat(sr.tekst).forEach((ar, i) => fresh.push({id:`f${si}-${i}`, ar, nl:"", les:naam, kind:"surah", file:true}));
  });
  const before = JSON.stringify(state.words.filter(w => w.file));
  state.words = state.words.filter(w => !w.file).concat(fresh);
  return before !== JSON.stringify(fresh);
}
readLocal();
migrate();
mergeBook();
const fileSurahsChanged = mergeFileSurahs();

const store = {db:null, uid:null, status:"local", writing:{}, pending:{}, timers:{}};
const dataFor = n => n === "woorden" ? {list: state.words} : n === "voortgang" ? {profiles: state.allProgress} : state.settings;
function persist(name){
  if (name === "instellingen" && active) {
    const s = state.settings; s.prof = Object.assign({}, s.prof);
    s.prof[active] = Object.fromEntries(PROF_KEYS.map(k => [k, s[k]]));
  }
  try { localStorage.setItem("atb:"+name, JSON.stringify(dataFor(name))); } catch(e) {}
  if (cloud) { clearTimeout(cloudTimers[name]); cloudTimers[name] = setTimeout(() => cloudFlush(name), 800); return; }
  if (!store.db) return;
  clearTimeout(store.timers[name]);
  store.timers[name] = setTimeout(() => flush(name), 700);
}
async function flush(name, retry){
  if (store.writing[name]) { store.pending[name] = true; return; }
  store.writing[name] = true;
  try {
    await store.db.collection("data/users/" + store.uid).doc(name).set(clone(dataFor(name)));
    store.status = "cloud";
  } catch(e) {
    if (e && e.code === "unavailable" && !retry) { store.writing[name] = false; setTimeout(() => flush(name, true), 800 + Math.random()*800); return; }
    store.status = e && e.code === "quota_exceeded" ? "full" : "error";
  }
  store.writing[name] = false;
  if (store.pending[name]) { store.pending[name] = false; flush(name); }
  updateSaveStatus();
}
async function connect(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  const timeout = new Promise(r => setTimeout(() => r("timeout"), 10000));
  const go = (async () => {
    const user = await window.claude.use("user");
    const db = await window.claude.use("db");
    if (!user || !db) return "none";
    const uid = await user.id();
    if (!uid) return "none";
    const col = db.collection("data/users/" + uid);
    const [w, p, s] = await Promise.all(["woorden","voortgang","instellingen"].map(n => col.doc(n).get()));
    store.db = db; store.uid = uid; store.status = "cloud";
    if (w.exists && Array.isArray(w.data().list)) state.words = clone(w.data().list);
    if (p.exists) loadProgress(clone(p.data()));
    if (s.exists) { state.settings = Object.assign(clone(DEFAULT_SETTINGS), clone(s.data())); migrate(); }
    const before = state.words.length;
    const fileChanged = mergeFileSurahs();
    if ((mergeBook() || fileChanged || state.words.length !== before) && w.exists) persist("woorden");
    return "ok";
  })().catch(() => "error");
  const r = await Promise.race([go, timeout]);
  if (r === "ok") {
    if (!$("#vStart").hidden) renderStart();
    if (!$("#vWho").hidden) renderWho();
    if (!$("#vParent").hidden) renderParent();
  }
  updateSaveStatus();
}

/* ================= Firebase (GitHub-versie): alles delen tussen apparaten ================= */
let cloud = null;
const cloudTimers = {}, cloudLast = {};
const progName = id => "voortgang_" + id;
/* Vaste volgorde van sleutels, zodat we onze eigen echo van Firebase herkennen. */
const stable = v => Array.isArray(v) ? "[" + v.map(stable).join(",") + "]"
  : v && typeof v === "object" ? "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}"
  : JSON.stringify(v === undefined ? null : v);
const localPending = n => !!cloudTimers[n.startsWith("voortgang_") ? "voortgang" : n];
function cloudPayload(name){
  if (name === "woorden") return {list: state.words.filter(w => !w.file)};
  if (name === "instellingen") return state.settings;
  return null;
}
async function cloudWrite(docName, data){
  const json = stable(data);
  if (cloudLast[docName] === json) return;
  cloudLast[docName] = json;
  try { await cloud.fs.setDoc(cloud.ref(docName), JSON.parse(JSON.stringify(data))); store.status = "fire"; }
  catch(e) { store.status = "fire-error"; delete cloudLast[docName]; }
  updateSaveStatus();
}
function cloudFlush(name){
  delete cloudTimers[name];
  if (!cloud) return;

        h("span", {class:"ar", lang:"ar"}, x.l),
        h("small", null, [x.vorm ? `${x.vorm}× verkeerde vorm${topForm(x.f)}` : null, x.letter ? `${x.letter}× verkeerde letter` : null, x.haraka ? `${x.haraka}× verkeerd teken` : null].filter(Boolean).flatMap((t,i) => i ? [h("br"), t] : [t])))))
        : h("p", {class:"note", style:"margin:0"}, "Nog geen fouten gemaakt. Hier zie je straks met welke letters het moeilijk gaat.")),
    h("div", {class:"panel"}, h("h2", null, "Per woord"),
      trouble.length ? h("div", {class:"tblwrap"}, h("table", null,
        h("thead", null, h("tr", null, ["Woord","Score","Geoefend","Verkeerde vorm","Verkeerde letter","Verkeerd teken","Laatst"].map(t => h("th", null, t)))),
        h("tbody", null, trouble.map(({w,p}) => h("tr", null,
          h("td", {class:"arw", lang:"ar"}, renderWord(parseWord(w.ar).units)),
          h("td", null, scorePill(p)), h("td", null, p.played), h("td", null, p.e.vorm), h("td", null, p.e.letter), h("td", null, p.e.haraka),
          h("td", {class:"note"}, p.last || ""))))))
        : h("p", {class:"note", style:"margin:0"}, "Nog niets geoefend.")),
    h("div", {class:"row"},
      confirmReset
        ? h("button", {class:"btn2 danger", onclick(){ state.allProgress[viewProf] = EMPTY_PROGRESS(); if (viewProf === active) state.progress = state.allProgress[active]; confirmReset = false; persist("voortgang"); renderParent(); }}, `Ja, voortgang van ${(profiles().find(x => x.id === viewProf) || {}).name} wissen`)
        : h("button", {class:"btn2 ghost", onclick(){ confirmReset = true; renderParent(); }}, "Voortgang wissen"),
      confirmReset ? h("button", {class:"btn2 ghost", onclick(){ confirmReset = false; renderParent(); }}, "Toch niet") : null));
}
function panelProfiles(){
  const s = state.settings;
  if (!s.profiles) s.profiles = clone(DEFAULT_PROFILES);
  return h("div", {class:"panel"}, h("h2", null, "Kinderen en hun spellen"),
    h("p", {class:"note", style:"margin:0"}, "Elk kind ziet alleen de spellen die hier aangevinkt zijn, en heeft eigen diamanten en voortgang."),
    s.profiles.map(pf => h("div", {class:"profrow"},
      h("div", {class:"field"}, h("label", {for:"pn-" + pf.id}, "Naam op de knop"), h("input", {id:"pn-" + pf.id, value:pf.name, oninput(ev){ pf.name = ev.target.value; persist("instellingen"); }})),
      h("div", {class:"gamechecks"}, Object.entries(GAME_LBL).map(([g, l]) => h("label", {class:"toggle"},
        h("input", {type:"checkbox", checked: pf.games.includes(g), onchange(ev){
          pf.games = ev.target.checked ? [...pf.games, g] : pf.games.filter(x => x !== g);
          if (!pf.games.length) pf.games = [g];
          persist("instellingen"); renderParent(); }}), l))))));
}
function panelSettings(){
  const s = state.settings;
  const upd = (k, v) => { s[k] = v; persist("instellingen"); };
  const sel = (id, k, opts) => h("select", {id, onchange(ev){ upd(k, Number(ev.target.value)); }},
    opts.map(([v,l]) => h("option", {value:v, selected: s[k] === v}, l)));
  return h("div", {class:"panel"},
    h("h2", null, "Instellingen"),
    h("div", {class:"grid2"},
      h("div", {class:"field"}, h("label", {for:"sHide"}, "Onthouden: woord in beeld"), sel("sHide", "hideSec", [[3,"3 seconden"],[5,"5 seconden"],[8,"8 seconden"],[12,"12 seconden"]])),
      h("div", {class:"field"}, h("label", {for:"sRound"}, "Woorden per ronde"), sel("sRound", "perRound", [[5,"5 woorden"],[8,"8 woorden"],[10,"10 woorden"],[15,"15 woorden"]])),
      h("div", {class:"field"}, h("label", {for:"sRace"}, "Mijnrace: snelheid van Robo"), sel("sRace", "raceTempo", ROBO_SPEEDS))),
    h("p", {class:"note", style:"margin:0"}, "Robo past zich ook zelf een beetje aan: wint je kind, dan wordt Robo iets sneller. Verliest hij, dan iets langzamer."),
    h("label", {class:"toggle"}, h("input", {type:"checkbox", id:"sSound", checked:s.sound, onchange(ev){ upd("sound", ev.target.checked); }}), "Geluid aan"),
    h("label", {class:"toggle"}, h("input", {type:"checkbox", id:"sHar", checked:s.checkHarakat, onchange(ev){ upd("checkHarakat", ev.target.checked); }}), "Harakat ook controleren"),
    h("p", {class:"note", style:"margin:0"}, "Zet harakat-controle uit als je kind nog alleen met letters en vormen oefent."));
}

/* ================= Ouderknop: 2 seconden vasthouden ================= */
(function(){
  const b = $("#parentBtn"); let t = null;
  const start = ev => { ev.preventDefault(); b.classList.add("holding"); t = setTimeout(() => { b.classList.remove("holding"); openParent(); }, 1600); };
  const stop = () => { clearTimeout(t); b.classList.remove("holding"); };
  b.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach(e => b.addEventListener(e, stop));
  b.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && !ev.repeat) start(ev); });
  b.addEventListener("keyup", stop);
  b.addEventListener("contextmenu", ev => ev.preventDefault());
})();
$("#stopBtn").addEventListener("click", () => { stopRaceLoop(); clearTimers(); if (play) play.popup = null; renderPopup(); show("vStart"); renderStart(); });

/* ================= Volledig scherm ================= */
(function(){
  const b = $("#fsBtn");
  const el = document.documentElement;
  const can = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (!can) return;
  b.hidden = false;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const upd = () => { const on = isFs(); $("#fsTxt").textContent = on ? "Klein scherm" : "Volledig scherm"; b.setAttribute("aria-label", on ? "Volledig scherm uit" : "Volledig scherm"); };
  b.addEventListener("click", async () => {
    sfx.tap();
    try {
      if (isFs()) await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
      else await (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen());
    } catch(e) { b.hidden = true; }
    upd();
  });
  document.addEventListener("fullscreenchange", upd);
  document.addEventListener("webkitfullscreenchange", upd);
})();

const st = document.createElement("style");
st.textContent = "@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}";
document.head.append(st);

$("#whoBtn").addEventListener("click", () => { stopRaceLoop(); clearTimers(); if (play) play.popup = null; renderPopup(); renderWho(); });
if (fileSurahsChanged) persist("woorden");
renderWho();
if (window.FIREBASE_CONFIG && window.GEZIN_ID) connectFirebase(); else connect();
</script>
